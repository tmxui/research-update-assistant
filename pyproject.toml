[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-update-assistant"
version = "0.1.0"
description = "Lern- und Portfolio-Projekt zur strukturierten Auswertung von Unternehmensresultaten."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.65,<2",
    "PyYAML>=6,<7",
    "plotly>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
